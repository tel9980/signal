name: 同步上游数据

# signal 站点除了行情层（px / indices，由 signal-data 管线覆盖）之外，
# 还有 30 多个数据文件来自上游 zentaox/signal（机构持仓、龙虎榜、标签、体检等）。
# 本工作流每天把上游 data/ 里"有变化"的文件同步到本 fork，避免分叉后数据永久落后。

on:
  schedule:
    - cron: '15 21 * * *'   # 每天 UTC 21:15 = 北京时间 05:15（上游通常在凌晨更新）
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 抓取并比对上游 data/（浅克隆，避免 raw CDN 缓存导致误判「没变化」）
        env:
          UPSTREAM_REPO: zentaox/signal
          UPSTREAM_REF: main
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${UPSTREAM_REPO}" /tmp/upstream -q
          git -C /tmp/upstream sparse-checkout set data
          git -C /tmp/upstream rev-parse --short HEAD

          changed=0
          same=0
          failed=0
          for f in /tmp/upstream/data/*.json; do
            name="data/$(basename "$f")"
            if [ -f "$name" ] && cmp -s "$f" "$name"; then
              same=$((same+1))
            else
              cp "$f" "$name" && changed=$((changed+1)) && echo "  ~ $name"
            fi
          done
          echo "有变化 $changed 个，未变 $same 个，失败 $failed 个"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
        id: fetch

      - name: 提交变化
        if: steps.fetch.outputs.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          MSG="chore: 同步上游数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 滚动提交：连续同步只保留一条，避免仓库无限膨胀
          if git log -1 --pretty=%s | grep -q '^chore: 同步上游数据'; then
            git commit --amend -m "$MSG"
          else
            git commit -m "$MSG"
          fi
          git push --force origin HEAD:main

      - name: 汇总
        run: |
          echo "### 同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "有变化文件数：${{ steps.fetch.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
