name: Deploy site to Pages

# 站点是纯静态文件（index.html / app.js / style.css / data/ / live.html），
# 直接把仓库根目录发到 Pages，不做任何构建。
on:
  push:
    branches: [main]
  # 关键补充（2026-11-11）：sync-upstream 用 GITHUB_TOKEN 提交，而 GitHub 的防递归规则
  # 不让 GITHUB_TOKEN 的 push 触发其它工作流，所以数据天天在更新、站点却停在最后一次
  # 人工提交那天的快照上（页面顶部「数据 11-09」就是这么来的）。
  # workflow_run 是「另一个工作流跑完」事件，不受这条规则限制。
  workflow_run:
    workflows: ["同步上游数据"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sync-upstream 是 amend + force push，触发方的 sha 可能已不是主干顶端，
          # 统一取 main 的最新提交，避免部署到被覆盖掉的旧树。
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true        # 首次运行自动开启 Pages（无需手动去设置页点）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
